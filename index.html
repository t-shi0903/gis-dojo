TEST123<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: single study column — progress header, one question card, chapter map below */
:root{
  --bg:#f0f0f0; --card:#ffffff; --fg:#1a1a1a; --muted:#6b6b6b; --line:#d4d4d4;
  --accent:#333333; --accent-soft:#e4e4e4; --ok:#1a1a1a; --ok-soft:#d2d2d2; --ng:#6b6b6b; --ng-soft:#f7f7f7; --warn:#555555;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --card:#1c1c1c; --fg:#e6e6e6; --muted:#9a9a9a; --line:#333333;
  --accent:#d6d6d6; --accent-soft:#2e2e2e; --ok:#f0f0f0; --ok-soft:#424242; --ng:#8c8c8c; --ng-soft:#161616; --warn:#bdbdbd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --card:#1c1c1c; --fg:#e6e6e6; --muted:#9a9a9a; --line:#333333;
  --accent:#d6d6d6; --accent-soft:#2e2e2e; --ok:#f0f0f0; --ok-soft:#424242; --ng:#8c8c8c; --ng-soft:#161616; --warn:#bdbdbd; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font-size:30px;font-weight:600;line-height:1}
.big small{font-size:15px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .p{background:var(--accent);opacity:.45}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.modes{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.sets .mode{border-radius:8px}
.sets{padding-bottom:2px;border-bottom:1px solid var(--line)}
.mode{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.mode .num{margin-left:4px;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.tag.miss{border-color:var(--ng);color:var(--ng)}
.streak{display:inline-flex;gap:3px;margin-left:auto}
.streak i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ok)}
.streak i.on{background:var(--ok)}
.q{font-size:17px;font-weight:700;line-height:1.75;margin:0}
.q .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);margin:0 .2em;text-align:center;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.tf{flex-direction:row}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;width:100%;line-height:1.55}
.opts.tf .opt{justify-content:center;font-size:24px;font-weight:700;padding:12px}
.opt .k{font-family:var(--f-num);color:var(--muted);font-size:12px;padding-top:2px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.mode:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.res{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.res.ok{background:var(--ok-soft)} .res.ng{background:var(--ng-soft)} .res.neu{background:var(--accent-soft)}
.res .h{font-weight:900;font-size:15px}
.res.ok .h{color:var(--ok)} .res.ng .h{color:var(--ng)} .res.neu .h{color:var(--accent)}
.res p{margin:0}
.ans{font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.act{border:none;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--card);flex:1 1 140px}
.act.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.act.okb{background:var(--ok)} .act.ngb{background:var(--ng)}
.hint{font-size:12px;color:var(--muted)}
.gloss{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 14px}
.gloss summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);padding:2px 0}
.gloss dl{margin:8px 0 4px;display:flex;flex-direction:column;gap:8px}
.gloss dl div{display:grid;grid-template-columns:minmax(7em,9em) 1fr;gap:10px;font-size:13px;line-height:1.6}
.gloss dt{font-weight:700} .gloss dd{margin:0;color:var(--fg)}
@media (max-width:480px){.gloss dl div{grid-template-columns:1fr;gap:0}}

.done{text-align:center;padding:30px 20px}
.done .big{font-size:40px}
h2{font-size:14px;font-weight:700;margin:0;color:var(--muted);letter-spacing:.06em}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.ch .t{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.dots i.s1{background:var(--accent);opacity:.55} .dots i.s2{background:var(--ok)} .dots i.x{box-shadow:inset 0 0 0 1.5px var(--ng)}
.rule{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.rule b{color:var(--fg)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.confirm{font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}}}
</style>

<script>
const Q=[
// GISと地図
{c:"GISと地図",u:1,t:"fill",q:"地理情報システム(GIS)とは，（　）を手がかりに，地理空間データをコンピューター上で総合的に管理・加工し，視覚的に表示し，高度な分析や迅速な判断を可能にする技術のことを言う。",a:"地理的位置",e:"国土地理院による定義。位置をキーにしてデータを重ね合わせるのがGISの本質。選択肢の「歴史的事象」はひっかけ。",m:1},
{c:"GISと地図",u:1,t:"fill",q:"地図とは，現実世界にあるモノや目に見えないモノ（行政界，バス路線など）を目的に応じて（　）化し，それらを見やすく整理・編集して平面的に表現した図のことを言う。",a:"抽象",e:"地図は必要なものを取捨選択して記号などに置き換えた（抽象化した）もの。"},
{c:"GISと地図",u:1,t:"tf",q:"空中写真や衛星画像も「地図」と言って良い。",a:"x",e:"写真や画像は写ったものを全部そのまま記録したもので，目的に応じた抽象化がされていないため地図とは言わない。"},
{c:"GISと地図",u:1,t:"tf",q:"地理空間データは，幾何データと属性データの組み合わせによって構成される。幾何データは地物の位置や形状，広がりを表す図形や画像データのことであり，属性データは地物の特徴を表す文字や数値のことである。",a:"o",e:"幾何データ＝位置・形（どこに・どんな形），属性データ＝中身（名前・種類・数値）。"},
{c:"GISと地図",u:1,t:"fill",q:"GIS上では，地理空間データは情報の種類や使用目的で分けて記録・管理されており，その分類単位を（　）と呼ぶ。複数の地理的位置で地理空間データを重ね合わせられるデータ構造を（　）構造と呼ぶ。",a:"レイヤ ／ レイヤ",e:"道路・建物・標高などを別々のレイヤにして，位置をそろえて重ねる。"},
// 空間参照系
{c:"空間参照系",t:"fill",q:"地理空間データは空間参照系に基づいて地球上の位置と関連づけられており，空間参照系には（　）方式と（　）方式の2種類がある。",a:"直接参照 ／ 間接参照",e:"直接参照＝座標（緯度経度など）で表す。間接参照＝住所や地域メッシュなどの地理識別子で表す。"},
{c:"空間参照系",t:"fill",q:"GISで扱う座標系には，主に（　）座標系と（　）座標系がある。",a:"地理 ／ 投影",e:"地理座標系＝緯度経度（球面上）。投影座標系＝平面に投影したX・Y（平面直角座標系，UTMなど）。"},
{c:"空間参照系",t:"mc",q:"測地基準系を構成する二つの柱はどれか。",o:["地球楕円体と地球座標系","ITRFとWGS84","赤道と本初子午線","地理緯度と地理経度"],a:0,e:"地球の形を近似する「地球楕円体」と，位置を表す「地球座標系」の2つ。ITRF・WGS84は座標系の具体例。"},
{c:"空間参照系",t:"mc",q:"三つの高さ（標高・楕円体高・ジオイド高）の関係式として正しいものはどれか。",o:["標高 ＝ 楕円体高 − ジオイド高","標高 ＝ 楕円体高 ＋ ジオイド高","標高 ＝ ジオイド高 − 楕円体高","標高 ＝ 楕円体高 × ジオイド高"],a:0,e:"楕円体高＝楕円体からの高さ（GNSSで得られる），ジオイド高＝楕円体からジオイド（平均海面）までの高さ。標高はジオイドからの高さなので，楕円体高からジオイド高を引く。"},
{c:"空間参照系",t:"tf",q:"世界測地系とは世界で共通に利用できる測地（基準）系のことであり，日本測地系とは現在日本で使用されている測地（基準）系のことである。",a:"x",e:"日本測地系（Tokyo Datum）は2002年まで使われていた旧い測地系。現在の日本はJGD2011などの世界測地系を使う。"},
{c:"空間参照系",t:"tf",q:"地球を平面に投影した地図には必ず距離，角度，面積のいずれかの歪みがあるが，適切な地図投影法を用いることにより，3つの歪みの全てを同時に解消することができる。",a:"x",e:"球面を平面にすると必ずどれかが歪む。正距・正角・正積などを目的に合わせて選ぶ。"},
{c:"空間参照系",u:1,t:"fill",q:"投影座標系を構成する重要な要素は「測地基準系」，「（　）」，そして「原点の設定」である。",a:"地図投影法（投影法）",e:"どの測地基準系で，どう平面に投影し，どこを原点にするか，の3点。「世界測地系」は測地基準系の一種なので不正解。",m:1},
{c:"空間参照系",t:"tf",q:"1を分子とする分数で縮尺を表す場合（たとえば1/25000），分母が大きい方が大縮尺となる。",a:"x",e:"分数の値が大きい＝分母が小さいほど大縮尺（狭い範囲を詳しく描く）。1/2500 は 1/25000 より大縮尺。"},
// 間接参照
{c:"間接参照方式",t:"fill",q:"間接参照方式とは，座標値ではなく（　）を用いて地球上の位置を特定する仕組みである。",a:"地理識別子",e:"住所，郵便番号，地域メッシュコードなど。"},
{c:"間接参照方式",t:"tf",q:"間接参照方式とは，「座標値」ではなく「地理識別子」を用いて地球上の位置を特定する仕組みである。",a:"o",e:"上の穴埋めと同じ内容の○×版。"},
{c:"間接参照方式",u:1,t:"fill",q:"地理識別子を座標値に変換する処理のことを（　）という。住所を座標値に変換する処理のことを，特に（　）と呼ぶ。",a:"ジオコーディング ／ アドレスマッチング",e:"選択肢に「ジオコー“ティ”ング」という綴りのひっかけがある。演習3で使ったのがアドレスマッチング。",m:1},
{c:"間接参照方式",t:"mc",q:"地域メッシュとはどのような仕組みか。",o:["地球を経度・緯度に基づいて規則的に分割した区画","標高に基づく地形分類区分","町丁目の行政区分を基準とする区画","各住所を文字列で識別するコード体系"],a:0,e:"緯度・経度で網目状に区切った区画。行政界に左右されないので統計の比較に便利。"},
{c:"間接参照方式",t:"mc",q:"地域メッシュコードの役割として正しいものはどれか。",o:["メッシュを識別するための一意の番号","投影法を示す","測地基準系を表す","住所を簡略化した俗称"],a:0,e:"区画ごとに1つだけ割り当てられる番号。"},
{c:"間接参照方式",t:"tf",q:"地域メッシュコードを扱う際には，使用している測地系を確認する必要がある。",a:"o",e:"日本測地系と世界測地系では同じ緯度経度でも位置がずれるので，同じコードでも区画の位置がずれる。"},
// 幾何データ
{c:"幾何データ",t:"mc",q:"幾何データの表現形式として正しい組み合わせはどれか。",o:["ベクタ形式とラスタ形式","メッシュ形式とジオコーディング形式","ラスタ形式とトポロジー形式","ベクタ形式とジオイド形式"],a:0,e:"幾何データはベクタ（点・線・面）とラスタ（格子状のセル）の2つ。"},
{c:"幾何データ",t:"fill",q:"トポロジーとは，ベクタ形式の幾何データにおいて図形同士の（　）的な関係を定義する仕組みである。",a:"空間",e:"隣接・接続・包含など，図形同士のつながり方。"},
{c:"幾何データ",u:1,t:"fill",q:"実世界に存在する地物を（　），（　），（　）の3つの要素で表現したデータをベクタデータと呼ぶ。ベクタデータに格納される属性情報は，一般的に（　）形式で格納され，図形情報と関連づけられている。",a:"点（ポイント）／ 線（ライン）／ 面（ポリゴン）、属性は 表（テーブル）形式",e:"ノード・チェーンはトポロジーの用語でひっかけ。属性は属性テーブル（表）に入る。",m:1},
{c:"幾何データ",t:"tf",q:"ラスタ形式の幾何データは，空間をセル（格子）に区切り，各セルに値を割り当てて表現する。",a:"o",e:"画像の画素（ピクセル）と同じ考え方。"},
{c:"幾何データ",t:"mc",q:"ラスタ形式の特徴として最も適切な説明はどれか。",o:["格子状のセルに値を割り当てて現実を表現する","直線や曲線を滑らかに描ける","複数の属性を持たせられる","座標のリストを使って形を表す"],a:0,e:"他の3つはベクタの特徴。"},
{c:"幾何データ",t:"mc",q:"次のうち，ラスタデータの長所にあたるものはどれか。",o:["連続的な現象を自然に表現できる","データ量が少なく効率的","複数属性を一つのセルに格納できる","境界を正確に表現できる"],a:0,e:"標高・気温など面的に連続して変わるものが得意。境界の正確さやデータ量の少なさはベクタの長所。"},
{c:"幾何データ",t:"mc",q:"ベクタデータとラスタデータの比較として正しいものはどれか。",o:["ベクタは解像度に依存しないが，ラスタは依存する","ラスタは複数の属性を扱えるが，ベクタは1属性のみ","ラスタはデータ量が少なく済み，ベクタは膨大になる","ベクタは連続現象に適し，ラスタは境界表現に適する"],a:0,e:"ラスタはセルの大きさで細かさが決まる。データ量はラスタの方が大きくなりやすいので3つ目は逆。",m:1},
{c:"幾何データ",t:"mc",q:"質的データをラスタ形式で表現する場合，どのようにデータをセルに格納するか。",o:["各カテゴリーに番号（ID）を割り当てて記録する","標高値を格納する","RGB値を格納する","実測値を直接数値として記録する"],a:0,e:"土地利用など種類を表すデータは，田＝1，森林＝2のように番号で記録する。"},
{c:"幾何データ",t:"tf",q:"ラスタデータでは，セルの値そのものが属性を意味するため，別途属性テーブルを持つ必要がない。",a:"o",e:"ベクタは図形と属性テーブルをつなぐが，ラスタはセル値が属性そのもの。",m:1},
{c:"幾何データ",t:"tf",q:"GISで良く用いられる標高データには，DEMとDSMがある。DEMは建物や樹木の高さを含むデータのことであり，DSMは地表面だけの高さデータのことである。",a:"x",e:"逆。DEM（Elevation）＝地表面だけ，DSM（Surface）＝建物・樹木を含む表面。"},
// ファイル形式・データ
{c:"ファイル形式とデータ",t:"tf",q:"シェープファイルは，ひとつの拡張子「.shp」ファイルのみで構成されている。",a:"x",e:".shp（図形）.shx（索引）.dbf（属性）.prj（座標系）など複数のファイルで1セット。"},
{c:"ファイル形式とデータ",t:"tf",q:"シェープファイル形式は単一ファイルではなく，構成する各ファイル（.shp, .dbf, .shx, .prj）の4つが揃ってはじめて完全な機能を果たす。",a:"o",e:"演習6で .shx と .prj が欠けて壊れたのはこのため。"},
{c:"ファイル形式とデータ",t:"tf",q:"シェープファイル形式は，ポイント，ライン，ポリゴンを表現できるベクタデータ形式である。",a:"o",e:"ただし1つのシェープファイルに入れられる図形の種類は1種類。"},
{c:"ファイル形式とデータ",t:"tf",q:"KMLは，Google Earthで採用されているベクタデータのファイル形式である。一つのKMLファイルに点，線，面などの幾何データとその属性データをまとめて記録できるため手軽に扱えるという優れた特長を持ち，厳密な分析でも使用可能である。",a:"x",e:"手軽さが長所だが，厳密な分析には向かない。最後の一文がひっかけ。",m:1},
{c:"ファイル形式とデータ",t:"tf",q:"GeoTIFF形式は，衛星画像や数値標高モデル（DEM）などのラスタデータの標準的な形式として広く利用されている。",a:"o",e:"TIFF画像に位置情報（座標系など）を埋め込んだ形式。演習7のDEMもGeoTIFF。"},
{c:"ファイル形式とデータ",t:"tf",q:"CSVファイル形式には，データがどの測地系や座標参照系に基づいているかという情報が含まれている。",a:"x",e:"CSVはただの表。読み込むときに自分でCRSを指定する（演習3）。",m:1},
{c:"ファイル形式とデータ",t:"tf",q:"CSVファイル形式は，点（ポイント）だけでなく，線（ライン）や面（ポリゴン）の地理空間データも表現できる。",a:"x",e:"基本は緯度経度などの列で点を表すだけ。"},
{c:"ファイル形式とデータ",t:"tf",q:"メタデータとは「データそのもの」を指す言葉である。",a:"x",e:"メタデータは「データについてのデータ」（作成者，作成日，座標系，精度など）。"},
{c:"ファイル形式とデータ",t:"tf",q:"オープンデータは「オープンなデータ」であるため，全て著作権フリーで利用することができる。",a:"x",e:"CCライセンスなどの利用条件（出典表示など）がある。"},
// 衛星測位
{c:"衛星測位",t:"tf",q:"GNSSという言葉は，世界中の衛星測位システムを総称したものであり，GPSはその一部である。",a:"o",e:"GPS（米国），みちびき（日本），GLONASS（ロシア），Galileo（EU）などをまとめてGNSS。",m:1},
{c:"衛星測位",t:"tf",q:"衛星測位には「単独測位」と「相対測位」の2種類があり，使用する受信機の数が異なる。",a:"o",e:"単独測位＝受信機1台，相対測位＝2台以上。"},
{c:"衛星測位",t:"tf",q:"相対測位では，2台の受信機が同時に異なる衛星の信号を受信することで誤差を打ち消す。",a:"x",e:"同時に「同じ」衛星を受信するから，共通の誤差を打ち消せる。"},
{c:"衛星測位",t:"mc",q:"次のうち，相対測位の特徴として正しいものはどれか。",o:["基準局と移動局を比較し，共通誤差を相殺する","外部情報を使わず，受信機単独で位置を求める","衛星の信号を利用せず，地上の基地局だけで測位する","精度は低いが手軽に利用できる"],a:0,e:"位置が分かっている基準局の誤差を使って移動局を補正するので高精度。2つ目と4つ目は単独測位の説明。"},
{c:"衛星測位",t:"mc",q:"3次元の衛星測位に必要な衛星の最小数はいくつか。",o:["4機","3機","5機","2機"],a:0,e:"未知数がx・y・zと受信機の時計のずれの4つあるので4機。"},
{c:"衛星測位",t:"mc",q:"GPS衛星に搭載されている装置のうち，測位精度に最も重要なものはどれか。",o:["原子時計","通信用アンテナ","カメラ","太陽電池"],a:0,e:"電波が届くまでの時間×光速で距離を出すため，時刻の正確さが精度を決める。",m:1},
{c:"衛星測位",t:"tf",q:"GEONETとは，日本で運用されているGNSS観測網のことで，国土地理院が整備・運用している。",a:"o",e:"全国約1300か所の電子基準点からなる観測網。",m:1},
{c:"衛星測位",t:"mc",q:"GEONETの電子基準点データを利用することで，従来の測量方法と比べてどのような利点があるか。",o:["基準局を現場に設置する必要がない","精度は低下するがコストは下がる","観測時間が短縮される","受信機が不要になる"],a:0,e:"電子基準点が基準局の代わりになるので，自分で基準局を置かずに相対測位ができる。",m:1},
// リモートセンシング
{c:"リモートセンシング",t:"mc",q:"空間分解能が「10m」の衛星画像の意味として正しいものはどれか。",o:["画像の1ピクセルが地上10m×10mの範囲を表す","10mより小さい物体は必ず識別できる","衛星が地上10mの高さを飛行している"],a:0,e:"1画素が表す地上の大きさ。10mより小さいものはむしろ識別しにくい。"},
{c:"リモートセンシング",t:"tf",q:"空間分解能とは，画像データが地上の対象物をどの程度細かく識別できるかを示す指標である。",a:"o",e:"空間分解能の定義そのもの。"},
{c:"リモートセンシング",t:"tf",q:"空間分解能の値が小さいほど，画像の細部をより高精度に識別できる。",a:"o",e:"1m分解能は10m分解能より細かく見える。"},
{c:"リモートセンシング",t:"tf",q:"画像を単に拡大して表示すれば，空間分解能そのものが高くなる。",a:"x",e:"拡大しても画素が大きく見えるだけで，情報量は増えない。"},
{c:"リモートセンシング",t:"tf",q:"リモートセンシングとは，対象に直接触れることなく，遠隔からその性質を把握する技術である。",a:"o",e:"人工衛星や航空機などから，離れた場所で対象を観測する技術。"},
{c:"リモートセンシング",t:"mc",q:"リモートセンシングが利用する主な物理的情報は次のうちどれか。",o:["電磁波の反射・放射","振動や圧力の変化","物体の音の反射","化学反応の速度"],a:0,e:"物体が反射したり自ら放射したりする電磁波（可視光・赤外線・マイクロ波など）を観測する。"},
{c:"リモートセンシング",t:"tf",q:"物体はすべて自分の温度に応じて電磁波を放射している。",a:"o",e:"温度をもつすべての物体は電磁波を出している。熱赤外センサはこれを観測する。"},
{c:"リモートセンシング",t:"mc",q:"能動型マイクロ波リモートセンシング（SAR）の特徴として正しいものはどれか。",o:["自ら電波を発射し，その反射波を観測する","赤外線カメラと同じ原理で動作する","地表から自然に出る電磁波を観測する","太陽光を反射させて観測する"],a:0,e:"能動型＝自分で電波を出す。だから夜間や雲があっても観測できる。自然の電磁波や太陽光の反射を観測するのは受動型。"},
{c:"リモートセンシング",t:"mc",q:"NDVIが高くなる典型的な場所として最も適切なのはどれか。",o:["森林","都市部","雪氷域","砂漠地帯"],a:0,e:"NDVIは植生の多さ・活性を表す指標。植物は近赤外を強く反射し赤を吸収するので、緑の濃い森林で高くなる。"},
{c:"リモートセンシング",t:"mc",q:"NDVIの値の理論範囲として正しいものはどれか。",o:["−1〜＋1","0〜1","0〜100","−100〜＋100"],a:0,e:"NDVI ＝（近赤外 − 赤）÷（近赤外 ＋ 赤）。分子の大きさは分母を超えないので−1〜＋1。水や雪はマイナス、植生が濃いほど＋1に近づく。"},
{c:"リモートセンシング",t:"tf",q:"フォールスカラー画像では，観測した波長と割り当てる色を一致させる。",a:"x",e:"一致させるのはトゥルーカラー。フォールスカラーは近赤外に赤を割り当てるなど、波長と色をあえてずらす（植生が赤く写る）。"},
{c:"リモートセンシング",t:"mc",q:"トゥルーカラー画像に関する説明として正しいものを選びなさい。",o:["人間の目で見た色調に近い画像","雲や雪の違いを明確に見分けられる画像","近赤外に赤を割り当てる画像","科学的解析に特化した不自然な色の画像"],a:0,e:"赤・緑・青の波長をそのまま赤・緑・青に割り当てるので、目で見た色に近い。「近赤外に赤」はフォールスカラー。"},
{c:"リモートセンシング",t:"mc",q:"ナチュラルカラー画像の説明として正しいものを選びなさい。",o:["近赤外情報に緑を割り当て，植生を自然な緑として表現する","近赤外情報に赤を割り当て，植生を赤く強調する","可視光のみを使って自然な色合いを再現する","すべての波長を白黒で表示する"],a:0,e:"ナチュラルカラー＝近赤外に緑（植生が自然な緑に見える）。近赤外に赤＝フォールスカラー、可視光のみ＝トゥルーカラー。この3つの区別が頻出。"},
{c:"リモートセンシング",t:"tf",q:"NDVIは，植生が可視赤色域をよく反射し，近赤外域をよく吸収するという分光特性を利用した指標であり，植物の量や活性度が高いほど大きくなる。",a:"x",e:"逆。植生は赤をよく「吸収」し，近赤外をよく「反射」する。だから NDVI＝（近赤外−赤）÷（近赤外＋赤）が植生で大きくなる。文の後半だけ正しいのがひっかけ。"},
{c:"リモートセンシング",t:"mc",q:"黒体放射に関する説明として正しいものはどれか。",o:["黒体はすべての波長を完全に吸収し，また放射する","黒体は特定の波長だけ反射する","黒体は放射率がゼロである","黒体は赤外線のみを放射する"],a:0,e:"黒体＝すべての波長を完全に吸収し，温度に応じて放射する理想的な物体（放射率＝1）。"},
{c:"リモートセンシング",t:"mc",q:"可視・近赤外リモートセンシングで取得された衛星画像の画素値（DN値）は何を表しているか。",o:["地表の反射率の強さ","光の波長","標高値","土地利用区分"],a:0,e:"DN（Digital Number）はセンサが受けた光の強さ＝地表の反射の強さを数値にしたもの。波長はバンドで区別する。",m:1},
{c:"リモートセンシング",t:"tf",q:"マイクロ波は可視光より波長が短く、雲を透過できない。",a:"x",e:"マイクロ波は可視光より波長が「長く」、雲を「透過できる」。だからSARは雲があっても夜でも観測できる。"},
{c:"リモートセンシング",t:"tf",q:"衛星画像はベクタデータで構成されている。",a:"x",e:"衛星画像は画素（セル）の集まり＝ラスタデータ。"},
{c:"リモートセンシング",t:"tf",q:"GISでは，ベクタ形式のデータからラスタ形式のデータへの変換はできるが，ラスタ形式のデータからベクタ形式のデータへの変換はできない。",a:"x",e:"どちら向きもできる。第14回の演習で「ラスタのベクタ化（ポリゴン化）」、第13回で「ベクタのラスタ化」をやった。"},
{c:"空間分析",t:"tf",q:"GISでは、ある対象物を基準として「等距離内」にある領域をバッファと呼ぶ。",a:"o",e:"バッファの定義そのもの。"},
{c:"空間分析",t:"mc",q:"バッファ解析の目的として最も適切なものを選びなさい。",o:["対象物の周囲の影響範囲や関連性を調べるため","画像を色ごとに分類するため","地形の標高を補正するため","統計データを非空間的に整理するため"],a:0,e:"例：避難所から500m以内に住む高齢者の数（第13回演習）。"},
{c:"空間分析",t:"tf",q:"GISでバッファを用いて空間解析を行う場合には，バッファ距離は，ベクタレイヤの座標参照系（CRS）に従った地図単位で定義されることに注意しなければならない。",a:"o",e:"緯度経度の座標系だと距離の単位が「度」になる。メートルで指定したいときはEPSG:6672などの投影座標系にする。"},
{c:"空間分析",t:"mc",q:"バッファ距離を定義する際に基準となるのはどれか。",o:["ベクタレイヤの座標参照系（CRS）","表示スケール（縮尺）","緯度経度グリッドの目盛り","画面解像度"],a:0,e:"上の○×問題と同じ内容の選択版。距離の単位はCRSで決まる。",m:1},
{c:"空間分析",t:"tf",q:"ボロノイ分割における各領域の境界線は、母点を結ぶ線分の垂直二等分線となる。",a:"o",e:"垂直二等分線上の点は2つの母点から等距離。だから各領域は「その母点が一番近い範囲」になる。"},
{c:"空間分析",t:"mc",q:"ボロノイ図が実際の地図上で表すものとして最も適切なのはどれか。",o:["施設の勢力圏","標高の等高線","気温の分布帯","河川の流域"],a:0,e:"どの施設（母点）に一番近いかで領域が分かれるので、施設の勢力圏を表す。"},
{c:"間接参照方式",t:"mc",q:"地域メッシュコードに関する次の記述のうち，正しいものを選びなさい。",o:["地域メッシュコードは、全国を一定の区画に分けて、統計データなどを空間的に集計・分析するために用いられる","地域メッシュコードは、地方自治体ごとに独自に定められた識別番号である","地域メッシュコードは、国際的なインターネットドメインを表すコードである","地域メッシュコードは、郵便番号と同じ目的で使用されている"],a:0,e:"緯度経度で機械的に区切るので自治体ごとの独自番号ではない。国勢調査の500mメッシュ（第13回）もこれ。"},
{c:"間接参照方式",t:"mc",q:"地域メッシュの大きな特徴として正しいものはどれか。",o:["階層構造を持ち、大きな区画をさらに分割できる","住所と同じで不規則に割り当てられる","一度決めたら細分化できない","国ごとに異なる規則で作られる"],a:0,e:"1次（約80km）→2次（約10km）→3次（約1km）→4次（約500m）と細かく分割できる。"},
{c:"間接参照方式",t:"mc",q:"国勢調査に関する以下の文章から正しいものを選びなさい。",o:["国勢調査は、5年に1度、日本に住むすべての人と世帯を対象に行う","国勢調査は、3年に1度、日本国籍を持つ人のみを対象に行う","国勢調査は、10年に1度、20歳以上の有権者を対象に行う","国勢調査は、毎年、日本の世帯主のみを対象に行う"],a:0,e:"5年ごと（2015・2020…）。外国人も含め、日本に住むすべての人と世帯が対象。第12回演習の2015→2020の人口変化もこのデータ。"},
// 幾何補正
{c:"幾何補正",t:"mc",q:"幾何補正が利用される代表的な場面として誤っているものを選びなさい。",o:["地図上の凡例のデザインを変更する場合","航空写真を背景図として利用する場合","古地図や印刷地図をデジタル化してGISで使う場合","手書き地図をGISに取り込む場合"],a:0,e:"凡例のデザインは見た目の調整で，位置合わせとは関係ない。"},
{c:"幾何補正",t:"mc",q:"幾何補正が必要となる理由として最も適切なものはどれか。",o:["画像が座標情報を持たず，地図と位置がずれているため","データ容量を軽くするため","地図の投影法を変更するため","地図の色を補正するため"],a:0,e:"演習8のUP.jpgのように，座標を持たない画像を地図に合わせるため。"},
{c:"幾何補正",t:"mc",q:"GCPを選定する際に望ましい条件として最も適切なものはどれか。",o:["地図と画像の両方で明確に確認でき，全体にバランスよく配置する","数は少ない方が誤差が減る","画像の片側に集中させる","鮮やかな色の部分を優先する"],a:0,e:"片寄ると点のない側のゆがみが大きくなる。交差点の角など両方で確実に分かる点を選ぶ。"},
{c:"幾何補正",t:"tf",q:"座標系が異なる地理空間データを重ね合わせるための処理を含む一連の作業をジオコーディングという。",a:"x",e:"この作業はジオリファレンス。ジオコーディングは地理識別子（住所など）を座標に変換すること。"},
{c:"幾何補正",t:"tf",q:"幾何補正において，位置が正確にわかっている地上の基準点はGCP（Ground Control Point）と呼ばれる。",a:"o",e:"Ground Control Point＝地上基準点。"},
{c:"幾何補正",t:"tf",q:"座標系が異なる地理空間データを重ね合わせるための処理を含む一連の作業をジオリファレンスという。",a:"o",e:"幾何補正を含む一連の作業がジオリファレンス。「ジオコーディング」に入れ替えた×版も出るので注意。"},
{c:"幾何補正",t:"tf",q:"幾何補正において，あらかじめ座標の値がわかっている地図上の特徴的な点を「電子基準点」という。",a:"x",e:"正しくは地上基準点（GCP：Ground Control Point）。電子基準点はGEONETでGNSS観測をしている基準点で別物。"},
{c:"幾何補正",t:"tf",q:"幾何補正とは，座標系が異なる地理空間データを正しく重ね合わせるための処理である。",a:"o",e:"講義資料の定義どおり。位置情報のある地図と位置情報のない画像を重ね合わせる処理。"},
{c:"トポロジー",t:"tf",q:"トポロジーとは，ベクタデータにおける図形同士の空間的な関係（接続・隣接など）を管理する仕組みのことである。",a:"o",e:"接続関係・隣接関係・面認識を定義したもの。"},

{c:"第11回 NDVI演習",t:"fill",q:"NDVI（正規化植生指標）は，近赤外の値をNIR，赤の値をRedとすると NDVI＝（　）で計算する。",a:"(NIR−Red)／(NIR＋Red)",e:"値は−1〜1。植生は赤を吸収し近赤外を強く反射するので，植生が多く活性が高いほど1に近づく。演習で結合した画像では4番目（@4）がNIR，3番目（@3）がRedだった（元のLandsat9のバンド番号では赤＝B4，近赤外＝B5）。"},
{c:"第11回 NDVI演習",t:"mc",q:"NDVIの値の範囲として正しいものはどれか。",o:["−1 〜 1","0 〜 255","0 〜 100","−100 〜 100"],a:0,e:"分子の絶対値は分母を超えないので −1〜1。0〜255は8bit画像の画素値の範囲。"},

{c:"第12回 国勢調査・e-Stat・メッシュ",t:"mc",q:"e-Stat（政府統計の総合窓口）の説明として正しいものはどれか。",o:["政府統計の情報をワンストップで提供するポータルサイトで，2008年から本運用されている","国土地理院が提供する地図閲覧サービスである","国勢調査だけを掲載する総務省の専用サイトである","民間企業が運営する有料の統計データベースである"],a:0,e:"各府省の統計データ・公表予定・調査票項目などをまとめて提供。第12・13回の演習で小地域集計や500mメッシュのデータをここから取得した。"},
{c:"第12回 国勢調査・e-Stat・メッシュ",t:"fill",q:"地理識別子を座標値に変換する処理を（　）といい，特に住所を座標値に変換する処理を（　）という。",a:"ジオコーディング ／ アドレスマッチング",e:"地名・住所・郵便番号などの地理識別子は人にはわかりやすいが，機械で扱うには座標に変換する必要がある。"},
{c:"第12回 国勢調査・e-Stat・メッシュ",t:"mc",q:"地域メッシュの大きさの組み合わせとして正しいものはどれか（1次・2次・3次・4次の順）。",o:["約80km・約10km・約1km・約500m","約100km・約10km・約1km・約100m","約50km・約5km・約500m・約250m","約80km・約8km・約800m・約80m"],a:0,e:"4次メッシュ（2分の1地域メッシュ）は3次メッシュを縦横に2等分した約500m四方。第13回演習で使ったのはこの500mメッシュ。"},
{c:"第12回 国勢調査・e-Stat・メッシュ",t:"fill",q:"4次メッシュ（2分の1地域メッシュ）とは，（　）次メッシュを緯線方向・経線方向に2等分してできる区域で，およそ（　）m四方となる。",a:"3 ／ 500",e:"3次メッシュ（約1km）を縦横2等分 → 約500m。"},

{c:"第12回 国勢調査・e-Stat・メッシュ",t:"mc",q:"地理座標系と投影座標系の説明の組み合わせとして正しいものはどれか。",o:["地理座標系＝緯度・経度で表す／投影座標系＝平面に投影してXY座標で表す","地理座標系＝XY座標で表す／投影座標系＝緯度・経度で表す","どちらも緯度・経度で表す","どちらも標高で表す"],a:0,e:"地理座標系（例 EPSG:6668）は3次元の地球上の位置を緯度経度で表す。投影座標系（例 平面直角座標系 EPSG:6672）は平面に投影してX・Y（m）で表す。"},

{c:"第13回 空間解析（バッファ・ボロノイ）",t:"fill",q:"ある母点までの距離が最短となる点の集合を1つのポリゴンで表したものを（　）といい，全ての母点について求めたものを（　）という。",a:"ボロノイ領域 ／ ボロノイ図",e:"境界線は母点どうしを結ぶ線分の垂直二等分線。"},
{c:"第13回 空間解析（バッファ・ボロノイ）",t:"tf",q:"ボロノイ分割は，人はより近くにある施設を利用する傾向があるという考えに基づき，コンビニや駅，郵便局などの勢力圏を分析するのに使われる。",a:"o",e:"店舗の立場では，競争相手との勢力関係を把握するのに使える。"},
{c:"第13回 空間解析（バッファ・ボロノイ）",t:"mc",q:"第13回演習（避難所から500m以内の75歳以上人口）で，ベクタデータのメッシュ人口をラスタに変換した処理はどれか。",o:["ラスタ化（ベクタ→ラスタ変換）","ポリゴン化（ラスタ→ベクタ変換）","ジオコーディング","幾何補正"],a:0,e:"ベクタとラスタは相互に変換できる。第13回＝ラスタ化，第14回＝土地利用ラスタのポリゴン化。"},
// 第14回
{c:"第14回 リモートセンシング",t:"tf",q:"可視・近赤外リモートセンシングは，太陽光の反射をとらえる方法なので，夜間や雲の下は観測できない。",a:"o",e:"太陽光が当たらない夜は観測できず，雲があると反射光がさえぎられる。"},
{c:"第14回 リモートセンシング",t:"tf",q:"熱赤外リモートセンシングは，地表から放出される熱赤外線をとらえるので，雲がなければ夜でも観測できる。",a:"o",e:"地表や海の表面温度，火山活動，山火事の状況がわかる。ただし雲は透過できない。"},
{c:"第14回 リモートセンシング",t:"tf",q:"熱赤外リモートセンシングは，雲があっても夜間でも観測できる。",a:"x",e:"夜はOKだが雲はNG。雲も夜も関係なく観測できるのは能動型マイクロ波（SAR）。"},
{c:"第14回 リモートセンシング",t:"mc",q:"3種類のリモートセンシングで，雲があっても夜間でも観測できるものはどれか。",o:["能動型マイクロ波リモートセンシング","可視・近赤外リモートセンシング","熱赤外リモートセンシング","すべて観測できる"],a:0,e:"可視・近赤外＝昼・晴れのみ。熱赤外＝夜OK・雲NG。能動型マイクロ波＝夜OK・雲OK。"},
{c:"第14回 リモートセンシング",t:"mc",q:"能動型マイクロ波リモートセンシングでわかることとして資料に挙げられていないものはどれか。",o:["地表面の温度","対象物の大きさや表面の性質（反射された電波の強さから）","対象物までのおおまかな距離（電波が戻るまでの時間から）","地盤災害のモニタリングや熱帯の森林違法伐採の観測"],a:0,e:"表面温度は熱赤外リモートセンシングでわかること。"},
{c:"第14回 リモートセンシング",t:"mc",q:"熱赤外リモートセンシングで知ることができるものとして最も適切なものはどれか。",o:["地面や海の表面温度，火山活動や山火事の状況","植物や田畑の分布状況","森林の違法伐採（熱帯の雲の多い地域）","対象物までの距離"],a:0,e:"植生の分布＝可視・近赤外。熱帯の違法伐採・距離＝能動型マイクロ波。"},
{c:"第14回 リモートセンシング",t:"fill",q:"衛星画像の画素値が8bitで記録されている場合，とりうる値は0〜（　）の（　）段階である。",a:"255 ／ 256",e:"nbitなら 2ⁿ 段階。2bit＝2²＝4段階（0〜3），8bit＝2⁸＝256段階（0〜255）。"},
{c:"第14回 リモートセンシング",t:"mc",q:"2bitで記録された衛星画像の画素値がとりうる範囲はどれか。",o:["0〜3","0〜1","0〜7","0〜255"],a:0,e:"2²＝4段階なので0〜3。8bitなら0〜255。"},
// 第15回
{c:"第15回 ハザードマップ・空間解析",t:"mc",q:"ハザードマップの説明として最も適切なものはどれか。",o:["自然災害の被害を予測し，被災想定区域や避難場所・避難経路などを地図に表示したもの","土地の所有者と地番を示した地図","過去の災害の写真を集めたアルバム","道路の渋滞情報をリアルタイムで表示した地図"],a:0,e:"自然災害による被害の軽減や防災対策のため，被災想定区域や防災関係施設の位置などを表示した地図。"},
{c:"第15回 ハザードマップ・空間解析",t:"mc",q:"ハザードマップの3つの目的に含まれないものはどれか。",o:["土地の資産価値を高める","災害から逃げる","事前対策を計画する","災害を具体的に知る"],a:0,e:"①災害から逃げる（避難情報の指導）②事前対策を計画する（危険度の違い・地域指定の根拠）③災害を具体的に知る（災害像を伝える）。"},
{c:"第15回 ハザードマップ・空間解析",t:"fill",q:"周辺部よりも標高が低く，排水が困難である地帯を（　）という。",a:"低位地帯",e:"第15回演習では「津波浸水想定域かつ低位地帯」を通る緊急輸送道路を抽出した。"},
{c:"第15回 ハザードマップ・空間解析",t:"mc",q:"「緊急輸送道路」の説明として正しいものはどれか。",o:["災害直後から避難・救助や物資供給などの応急活動のために，緊急車両の通行を確保すべき重要な路線","津波の際に住民が徒歩で避難するための道路","土砂災害のおそれがある区域の道路","災害時に通行止めになることが決まっている道路"],a:0,e:"高速自動車国道や一般国道，それらを連絡する幹線的な道路が指定される。"},
{c:"第15回 ハザードマップ・空間解析",t:"mc",q:"「津波浸水想定」の説明として正しいものはどれか。",o:["最大クラスの津波があった場合に想定される浸水の区域・水深","過去100年間に実際に浸水した区域","想定し得る最大規模の降雨で河川が氾濫した場合の浸水区域","土砂災害のおそれがある区域"],a:0,e:"河川氾濫による浸水は「浸水想定区域」，土砂災害は「土砂災害警戒区域」。"},
{c:"第15回 ハザードマップ・空間解析",t:"mc",q:"「浸水想定区域」の説明として正しいものはどれか。",o:["想定し得る最大規模の降雨により河川が氾濫した場合に浸水が想定される区域","最大クラスの津波で浸水が想定される区域","周辺よりも標高が低く排水が困難な地帯","高潮で浸水した記録のある区域"],a:0,e:"津波＝津波浸水想定，河川の氾濫＝浸水想定区域，の区別がポイント。"},
{c:"第15回 ハザードマップ・空間解析",t:"tf",q:"「切り抜き」によってできる出力レイヤは，入力レイヤ（くり抜かれる側）とオーバーレイレイヤ（くり抜く側）の両方の属性を保持する。",a:"x",e:"両方の属性を持つのは「交差」。「切り抜き」は入力レイヤの属性だけ。"},
{c:"第15回 ハザードマップ・空間解析",t:"mc",q:"「交差」によってできる出力レイヤが保持する属性として正しいものはどれか。",o:["入力レイヤとオーバーレイレイヤの両方の属性","入力レイヤ（くり抜かれる側）の属性のみ","オーバーレイレイヤ（くり抜く側）の属性のみ","属性は保持されない"],a:0,e:"だから第15回演習では，交差で道路に市の名前を付けて市ごとの延長を集計した。"},
{c:"第15回 ハザードマップ・空間解析",t:"mc",q:"避難所のポイントデータ（ベクタ）を使って，DEM（ラスタ）から各避難所の標高値を取得するときに使うツールはどれか。",o:["ポイントサンプリングツール","バッファ","ボロノイ分割","ジオリファレンサ"],a:0,e:"第15回演習の最初で使った。ポイント位置のラスタ値を属性として取り出す。"},

{c:"第10回 ベクタ・ラスタ・トポロジー",t:"tf",q:"ベクタデータでは別にテーブルが用意されて属性が記録されるが，ラスタデータではセルに記録されている値自体が属性である。",a:"o",e:"だからベクタは1つの点・線・面に複数の属性を持てるが，ラスタは1つのセルに1つの属性しか持てない。"},
{c:"第10回 ベクタ・ラスタ・トポロジー",t:"mc",q:"ベクタデータのうち，トポロジー（位相）構造が付与されるものはどれか。",o:["線と面","点のみ","点と線","ラスタのセル"],a:0,e:"トポロジー＝図形どうしの「接続関係・隣接関係・面認識」を定義したもの。線と面に付与される。"},
{c:"第10回 ベクタ・ラスタ・トポロジー",t:"mc",q:"トポロジーを構成する要素の説明として正しい組み合わせはどれか。",o:["ノード＝線分の始点・終点や交点，チェーン＝ノードどうしを結ぶ方向性を持つ線分，ポリゴン＝チェーンの組み合わせからなる面","ノード＝面，チェーン＝点，ポリゴン＝線","ノード＝属性テーブル，チェーン＝座標系，ポリゴン＝縮尺","ノード＝セル，チェーン＝バンド，ポリゴン＝画素値"],a:0,e:"ポリゴンを構成するチェーンの並びには時計回り（または反時計回り）の向きが規約として決められている。"},
{c:"第10回 ベクタ・ラスタ・トポロジー",t:"mc",q:"ベクタデータがトポロジーを持つメリットとして資料に挙げられていないものはどれか。",o:["データ容量が必ず小さくなる","図形編集が容易になる","最短経路探索や面積計算などネットワーク解析ができる","データ不整合を防止できる"],a:0,e:"メリットは①図形編集が容易②ネットワークとみなした解析③空間的なルールを持ったデータの保持④データ不整合の防止。"},
{c:"第10回 ベクタ・ラスタ・トポロジー",t:"tf",q:"幾何補正でGCPを選ぶときは，空間的に偏りがないように満遍なく選定する。",a:"o",e:"交差点など地図と画像の両方で確認できる場所を，画像全体にバランスよく配置する。"},
// 第11回 講義
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"リモートセンシングの定義に含まれる3つの要素として正しいものはどれか。",o:["対象物が反射・放射する電磁波を，対象物に触れることなく遠隔から計測し，形状や性質を識別する","対象物に直接触れて温度を測り，記録する","現地調査で撮影した写真を地図に貼り付ける","住所を座標に変換して地図に表示する"],a:0,e:"①反射・放射される電磁波を ②非接触で遠隔から計測し ③形状や性質を識別する技術。"},
{c:"第11回 リモートセンシング・カラー合成",t:"fill",q:"黒体の表面温度をT（K），シュテファン・ボルツマン定数をσとすると，黒体が放射するエネルギーは E(T)＝（　）で表される。",a:"σT⁴",e:"放射エネルギーは表面温度の4乗に比例。黒体でない物体は放射率εをかけて E＝εE(T)＝εσT⁴（0≦ε≦1，黒体はε＝1）。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"黒体でない物体（放射率ε）が放射するエネルギーEを表す式はどれか。",o:["E＝εσT⁴","E＝σT⁴／ε","E＝εσT²","E＝σT"],a:0,e:"黒体：E(T)＝σT⁴。黒体でない場合：E＝εE(T)。Tは表面温度（K）。"},
{c:"第11回 リモートセンシング・カラー合成",t:"tf",q:"熱の伝わり方の1つである「放射」は，電磁波によって熱が直接移動する現象であり，電磁波は真空中でも伝わる。",a:"o",e:"だから宇宙の衛星で地表からの熱赤外線（放射）を観測できる。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"人間の眼の「可視域」としてもっとも適切な範囲はどれか。",o:["およそ380〜780nm","およそ100〜300nm","およそ1〜10μm","およそ1mm〜1m"],a:0,e:"可視光は紫（短い）〜赤（長い）。それより長いのが赤外線，さらに長いのがマイクロ波。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"可視光線と近赤外線の反射率の大小関係として正しい組み合わせはどれか。",o:["可視光線：水＜植物＜土　近赤外線：水＜土＜植物","可視光線：植物＜水＜土　近赤外線：土＜水＜植物","可視光線：水＜土＜植物　近赤外線：水＜植物＜土","可視光線：土＜植物＜水　近赤外線：植物＜土＜水"],a:0,e:"水はどちらでも最小。植物は近赤外で最大になる（→NDVIが大きくなる理由）。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"光学センサとマイクロ波センサの説明として正しいものはどれか。",o:["光学センサは可視光線と赤外線を，マイクロ波センサはそれより波長の長いマイクロ波を観測する","光学センサはマイクロ波を，マイクロ波センサは可視光線を観測する","どちらも可視光線だけを観測する","マイクロ波センサは可視光線より波長の短い電磁波を観測する"],a:0,e:"光学センサ→可視・近赤外RSと熱赤外RSの2種類。マイクロ波センサ→受動型と能動型の2種類。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"受動型マイクロ波リモートセンシングで観測するのに適しているものはどれか。",o:["海面温度，積雪量，氷の厚さ","植物や田畑の分布状況","対象物までの距離","森林の違法伐採"],a:0,e:"受動型＝地表から自然に放射されるマイクロ波を観測（例：南極の海氷分布）。能動型＝自分で電波を出して反射を観測（SAR）。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"リモートセンシングの4つの特徴に含まれないものはどれか。",o:["地下深くの地層を直接観測できる","広域性・瞬時性","反復性","非接触性"],a:0,e:"4つの特徴＝(1)広域性・瞬時性 (2)反復性（一定周期で同じ場所を観測）(3)非接触性 (4)人間の目では見えない情報（温度など）を知ることができる。"},
{c:"第11回 リモートセンシング・カラー合成",t:"tf",q:"観測衛星は一定の周期で地球を周回しているため，繰り返し同じ場所を観測できる。これをリモートセンシングの反復性という。",a:"o",e:"例：モンゴルの森林火災の前後比較。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"リモートセンシングの利用例の組み合わせとして誤っているものはどれか。",o:["地表の高さを計る：エルニーニョ現象","地表の温度を計る：ヒートアイランド現象","海面の温度を計る：黒潮の蛇行，漁場予測","水の状況を計る：ダムの貯水量，洪水の被害状況"],a:0,e:"エルニーニョは「海面の温度」。地表の高さ→地図の作成。ほかに植物（森林伐採・砂漠化・水田），大気（天気予報・台風）。"},
{c:"第11回 リモートセンシング・カラー合成",t:"tf",q:"センサごとに観測できる波長の範囲が少しずつ異なるのは，観測目的に応じた波長の範囲をセンサ毎に設定しているからである。",a:"o",e:"同じ「バンド4」でも衛星によって波長が違うので注意（Landsat8・9では赤がバンド4，近赤外がバンド5）。"},
{c:"第11回 リモートセンシング・カラー合成",t:"fill",q:"異なる波長帯で観測した3枚の画像に光の3原色（赤，緑，青）を割り当てて合成表示する処理を（　）という。",a:"カラー合成表示",e:"組み合わせ方でトゥルーカラー，フォールスカラー，ナチュラルカラーに分かれる。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"講義資料の例で，青＝バンド3（緑），緑＝バンド4（赤），赤＝バンド5（近赤外）を割り当てた画像はどれか。",o:["フォールスカラー画像","トゥルーカラー画像","ナチュラルカラー画像","NDVI画像"],a:0,e:"近赤外に赤 → フォールスカラー（植物が赤く見える）。近赤外に緑 → ナチュラルカラー。青・緑・赤にそのまま同じ色 → トゥルーカラー。"},
{c:"第11回 リモートセンシング・カラー合成",t:"mc",q:"講義資料の例で，青＝バンド3（緑），緑＝バンド5（近赤外），赤＝バンド4（赤）を割り当てた画像はどれか。",o:["ナチュラルカラー画像","トゥルーカラー画像","フォールスカラー画像","パンクロマチック画像"],a:0,e:"近赤外に緑を割り当てるので植物が緑に見える＝「自然らしい色」→ナチュラルカラー。"},
{c:"第11回 リモートセンシング・カラー合成",t:"tf",q:"フォールスカラー画像では，植物からの反射が強い近赤外の画像に赤を割り当てるので，植物の分布域が赤で強調され判読しやすくなる。",a:"o",e:"観測波長帯の色と別の色を割り当てるので「フォールス（偽）」カラー。"},

function terms(text){
  let t=text; const out=[];
  const al=[]; G.forEach((g,i)=>g[1].forEach(a=>al.push([a,i])));
  al.sort((x,y)=>y[0].length-x[0].length);
  al.forEach(([a,i])=>{ if(t.includes(a)){ if(!out.includes(i)) out.push(i); t=t.split(a).join("\u0000".repeat(a.length)); }});
  return out.sort((a,b)=>text.indexOf(G[a][1].find(x=>text.includes(x))||"")-text.indexOf(G[b][1].find(x=>text.includes(x))||"")).map(i=>G[i]);
}

const N=Q.length;
const KEY="gisdojo-v1";
let st={}; // id -> {s:streak, w:wrongInApp, n:attempts}
let localSt={}; try{localSt=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){localSt={}}
const save=()=>{pushSoon()};
const S=i=>st[i]||(st[i]={s:0,w:0,n:0});
const mastered=i=>S(i).s>=2;
const weak=i=>S(i).w>0;
let set="q"; try{set=localStorage.getItem(KEY+"-set")||"q"}catch(e){}
const pool=()=>Q.filter(q=>set==="all"||q.src===set);
let mode="due", queue=[], cur=null, answered=false, sessionDone=0, backlog=[];
const W=8; // 同時に練習する問題数
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function build(){
  if(!cloud){ lock(lockMsg); return; }
  let ids=pool().map(q=>q.id);
  if(mode==="due") ids=ids.filter(i=>!mastered(i));
  if(mode==="miss") ids=ids.filter(i=>weak(i)&&!mastered(i));
  if(mode==="all"){queue=shuffle(ids);backlog=[];}
  else{const pr=i=>S(i).s===1||weak(i);backlog=[...shuffle(ids.filter(pr)),...shuffle(ids.filter(i=>!pr(i)))];queue=backlog.splice(0,W);}
  sessionDone=0; next();
}
function next(){ cur=queue.length?Q[queue.shift()]:null; answered=false; render(); }
function grade(ok){
  const s=S(cur.id); s.n++;
  if(ok){s.s++; if(s.s<2&&mode!=="all") queue.splice(Math.min(4,queue.length),0,cur.id); else if(s.s>=2&&backlog.length) queue.push(backlog.shift())}
  else {s.s=0; s.w++; queue.splice(Math.min(2,queue.length),0,cur.id)}
  save(); answered=true; sessionDone++;
}
function stats(){
  const P=pool(), N=P.length;
  let m=0,p=0; P.forEach(q=>{const s=S(q.id).s; if(s>=2)m++; else if(s===1)p++});
  $("pBig").innerHTML=`${m}<small> / ${N} 完璧</small>`;
  $("barM").style.width=(m/N*100)+"%"; $("barP").style.width=(p/N*100)+"%";
  const rest=N-m;
  $("pRest").textContent=rest?`残り${rest}問（あと1回で完璧：${p}問）`:"全問完璧です";
  $("cDue").textContent=rest; $("cAll").textContent=N; $("cMiss").textContent=P.filter(q=>weak(q.id)&&!mastered(q.id)).length;
  document.querySelectorAll(".mode[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  document.querySelectorAll(".mode[data-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.set===set));
  const ql=Q.filter(q=>q.src==="q"), ll=Q.filter(q=>q.src==="l");
  $("sQ").textContent=`${ql.filter(q=>mastered(q.id)).length}/${ql.length}`; $("sL").textContent=`${ll.filter(q=>mastered(q.id)).length}/${ll.length}`; $("sA").textContent=`${Q.filter(q=>mastered(q.id)).length}/${Q.length}`;
  const cs=[...new Set(P.map(q=>q.c))];
  $("chaps").innerHTML=cs.map(c=>{const qs=P.filter(q=>q.c===c);const mm=qs.filter(q=>mastered(q.id)).length;
    return `<div class="ch"><div class="t"><span>${c}</span><span class="num">${mm}/${qs.length}</span></div><div class="dots">${qs.map(q=>{const s=S(q.id).s;return `<i class="${s>=2?"s2":s===1?"s1":""} ${weak(q.id)&&s<2?"x":""}" title="${esc(q.q.slice(0,30))}…"></i>`}).join("")}</div></div>`}).join("");
}
function esc(t){return t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){
  stats();
  const el=$("stage");
  if(!cur){
    const P=pool(), allM=P.every(q=>mastered(q.id)), nm={q:"小テスト",l:"講義資料",all:"全範囲"}[set];
    el.innerHTML=`<div class="card done"><div class="big num">${allM?`${P.length} / ${P.length}`:"おつかれさま"}</div><p>${allM?`${nm}の全${P.length}問を2回連続で正解しました。${nm}は完璧です。`:`このモードの問題は終わりました（今回 ${sessionDone} 回答）。`}</p><div class="row"><button class="act" id="again">${allM?"全問でもう一周":"未習得をもう一周"}</button></div></div>`;
    $("again").onclick=()=>{mode=allM?"all":"due";build()};
    return;
  }
  const q=cur, s=S(q.id), left=queue.length+1+backlog.length;
  let body="";
  const qtext=esc(q.q).replace(/（　）/g,'<span class="blank">？</span>');
  if(q.t==="tf"){
    body=`<div class="opts tf">${["o","x"].map(v=>`<button class="opt" data-v="${v}">${v==="o"?"○":"×"}</button>`).join("")}</div>`;
  }else if(q.t==="mc"){
    q._ord=shuffle(q.o.map((_,i)=>i));
    body=`<div class="opts">${q._ord.map((oi,k)=>`<button class="opt" data-v="${oi}"><span class="k">${k+1}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>`;
  }else{
    body=`<div class="row"><button class="act" id="reveal">答えを表示</button></div><p class="hint">答えを頭に浮かべてから表示し，自分で採点します。</p>`;
  }
  const tl=terms(q.q+" "+(q.o||[]).join(" "));
  const gl=tl.length?`<details class="gloss" id="gloss"><summary>用語の意味（${tl.length}）<span class="hint">　答えのヒントになる場合があります</span></summary><dl>${tl.map(g=>`<div><dt>${esc(g[0])}</dt><dd>${esc(g[2])}</dd></div>`).join("")}</dl></details>`:"";
  el.innerHTML=`<div class="card" id="qcard">
    <div class="meta"><span class="tag">${q.c}</span><span class="tag">${q.t==="tf"?"○×":q.t==="mc"?"選択":"穴埋め"}</span>${weak(q.id)?'<span class="tag miss">苦手</span>':""}${q.u?'<span class="tag" title="友達の画面で正解表示がなかったため、講義の定義から判断した答え">答え推定</span>':""}<span class="num">${backlog.length?`練習中 ${queue.length+1}・未出題 ${backlog.length}`:`残り ${left}`}</span><span class="streak" title="連続正解"><i class="${s.s>=1?"on":""}"></i><i class="${s.s>=2?"on":""}"></i></span></div>
    <p class="q">${qtext}</p>${gl}${body}<div id="after"></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b));
  const r=$("reveal"); if(r) r.onclick=reveal;
}
function feedback(ok,neutral){
  const gd=$("gloss"); if(gd) gd.open=true;
  const q=cur; const ansTxt=q.t==="tf"?(q.a==="o"?"○":"×"):q.t==="mc"?q.o[q.a]:q.a;
  $("after").innerHTML=`<div class="res ${neutral?"neu":ok?"ok":"ng"}"><div class="h">${neutral?"答え":ok?"正解":"不正解"}</div><p class="ans">${esc(ansTxt)}</p><p>${esc(q.e)}</p></div>
  ${neutral?`<div class="row"><button class="act okb" id="selfOk">合ってた</button><button class="act ngb" id="selfNg">違った</button></div>`:`<div class="row"><button class="act" id="nextBtn">次へ</button></div>`}`;
  if(neutral){$("selfOk").onclick=()=>{grade(true);stats();next()};$("selfNg").onclick=()=>{grade(false);stats();next()}}
  else {$("nextBtn").onclick=next; $("nextBtn").focus()}
}
function choose(b){
  if(answered) return;
  const q=cur, v=b.dataset.v, ok=String(q.a)===v;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(String(q.a)===x.dataset.v)x.classList.add("right")});
  if(!ok) b.classList.add("wrong");
  grade(ok); stats(); feedback(ok,false);
}
function reveal(){ $("reveal").parentElement.nextElementSibling.remove(); $("reveal").remove(); answered=true; feedback(null,true); }
document.addEventListener("keydown",e=>{
  if(!cur||e.metaKey||e.ctrlKey) return;
  const k=e.key.toLowerCase();
  if(e.target.closest&&e.target.closest(".modes,.foot")) return;
  if(k==="enter"){ if($("nextBtn")){e.preventDefault();next()} else if($("reveal")){e.preventDefault();reveal()} return }
  if(answered){ if($("selfOk")&&(k==="o"||k==="1")){e.preventDefault();$("selfOk").click()} else if($("selfNg")&&(k==="x"||k==="2")){e.preventDefault();$("selfNg").click()} return }
  if(cur.t==="tf"&&(k==="o"||k==="x"||k==="1"||k==="2")){const v=k==="o"||k==="1"?"o":"x";const b=document.querySelector(`.opt[data-v="${v}"]`);b&&choose(b)}
  if(cur.t==="mc"&&/^[1-4]$/.test(k)){const b=document.querySelectorAll(".opt")[+k-1];b&&choose(b)}
});
document.querySelectorAll(".mode[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;build()});
document.querySelectorAll(".mode[data-set]").forEach(b=>b.onclick=()=>{set=b.dataset.set;try{localStorage.setItem(KEY+"-set",set)}catch(e){};mode="due";build()});
function resetUI(){$("resetBox").innerHTML=`<button class="link" id="resetBtn">記録をリセット</button>`;
  $("resetBtn").onclick=()=>{$("resetBox").innerHTML=`<span>全部の記録を消しますか？</span><button class="link" id="rYes" style="color:var(--ng)">消す</button><button class="link" id="rNo">やめる</button>`;
    $("rYes").onclick=()=>{st={};save();mode="due";resetUI();build()}; $("rNo").onclick=resetUI;};}
resetUI();
var lockMsg="ログインを確認しています…";
function lock(msg){ lockMsg=msg; cur=null; queue=[]; backlog=[]; stats(); const el=$("stage"); el.innerHTML='<div class="card done"><div class="big">🔒</div><p id="lockP"></p></div>'; $("lockP").textContent=msg; }
const NEED="この道場はclaude.aiにログインしている人だけ使えます。ログインして、共有してもらったリンクから開いてください。";
const NOWRITE="記録を保存する権限がありません。共有した人に「書き込みできる権限（Contributor以上）」で招待してもらってください。";
lock(lockMsg);


// アカウント同期（claude.aiにログインしている人ごとに記録を保存。使えないときはこの端末に保存）
var cloud=null, saving=false, dirty=false, pushTimer=null;
function setSync(t){const el=document.getElementById("syncNote"); if(el) el.textContent=t;}
function pushSoon(){ if(!cloud) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushCloud,1200); }
async function pushCloud(){
  if(!cloud) return; if(saving){dirty=true;return} saving=true;
  try{ do{ dirty=false; await cloud.ref.set({st:JSON.stringify(st),t:Date.now()}); }while(dirty); setSync(cloud.label); }
  catch(e){ const c=e&&e.code; if(c==="invalid_argument"||c==="revoked"||c==="not_granted"){ cloud=null; setSync("記録：保存できません"); lock(c==="invalid_argument"?NOWRITE:NEED); } else { setSync("記録：保存に失敗しました（次に解いたときにもう一度保存します）"); } }
  saving=false;
}
// GitHub Pages版：記録はこのブラウザに保存
if(!window.claude){ st=localSt; cloud={ref:{set:async d=>{try{localStorage.setItem(KEY,d.st)}catch(e){}}},label:""}; build(); }
(async()=>{
  const C=window.claude; if(!C||typeof C.use!=="function") return;
  let db=null,user=null;
  try{ [db,user]=await Promise.all([C.use("db"),C.use("user")]); }catch(e){ lock(NEED); return; }
  if(!db||!user){ setSync("記録：未ログイン"); lock(NEED); return; }
  let id=null; try{ id=await user.id(); }catch(e){}
  if(!id){ setSync("記録：未ログイン"); lock(NEED); return; }
  try{ if((await user.can("data.write"))===false){ setSync("記録：保存できません"); lock(NOWRITE); return; } }catch(e){}
  let name=""; try{ const me=await user.me(); name=(me&&me.name)||""; }catch(e){}
  const ref=db.doc("data/users/"+id+"/progress");
  setSync("記録：アカウントに接続中…");
  const slow=setTimeout(()=>lock("アカウントにつながりません。通信状況を確かめて、ページを開き直してください。"),10000);
  let snap=null; try{ snap=await ref.get(); }catch(e){ clearTimeout(slow); lock("アカウントにつながりません。ページを開き直してください。"); return; }
  clearTimeout(slow);
  const clean=r=>{const o={}; for(const k in r){const a=r[k]; if(a&&typeof a==="object") o[k]={s:+a.s||0,w:+a.w||0,n:+a.n||0}} return o};
  let fresh=false;
  if(snap&&snap.exists){ try{ st=clean(JSON.parse((snap.data()||{}).st||"{}")); }catch(e){ st={}; } }
  else { st=clean(localSt); fresh=true; } // 初回だけ、このブラウザの記録を引き継ぐ
  cloud={ref, label:"記録："+(name?name+"さんの":"")+"アカウントに保存中（スマホとPCで同期）"};
  setSync(cloud.label);
  if(fresh) await pushCloud();
  if(cloud) build();
})();
</script>

</body></html>
